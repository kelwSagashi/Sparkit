name: Python package

# Run on tag pushes (publish), on pushes to main (build for validation),
# and allow manual runs from the Actions UI.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install --upgrade build twine
          python -m pip --version
          python --version

      - name: Build distributions
        run: |
          set -euxo pipefail
          rm -rf dist build
          python -m build -v
          echo "--- dist contents ---"
          find dist -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Debug context
        # Always run this step to capture event context for debugging
        run: |
          set -euxo pipefail
          echo "--- Debug: GitHub Actions context ---"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF_TYPE=${GITHUB_REF##*/}"
          if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            echo "--- event payload ---"
            cat "$GITHUB_EVENT_PATH" || true
          else
            echo "No GITHUB_EVENT_PATH available"
          fi

      - name: Publish to PyPI
        # Only publish when this run was triggered by a tag push (refs/tags/v...)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"
        run: |
          set -euxo pipefail
          echo "--- dist contents before twine upload ---"
          find dist -maxdepth 1 -type f -print -exec ls -lh {} \;
          python -m twine --version
          python -m pip install --upgrade twine
          # Use verbose + non-interactive to show full server response on failures
          python -m twine upload --verbose --non-interactive dist/*
